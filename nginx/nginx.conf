# nginx load balancer for the DISBank app tier (IMPROVEMENT_PLAN §0.4).
#
# Replaces the client-side "pick a random port 8080..8085" hack with a single
# stable entrypoint. nginx round-robins across the app instances by default;
# adding/removing an app replica is just editing the upstream list here.

events {}

http {
    upstream disbank_app {
        # Reached by Docker service name on the internal network (app-N:8080).
        # No host port mapping needed — these are container-to-container.
        server app-1:8080;
        server app-2:8080;
        server app-3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://disbank_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
